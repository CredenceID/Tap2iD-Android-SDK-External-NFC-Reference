[versions]
# Tap2iD SDK, from the Credence ID Maven repository. One SDK build publishes three artifacts
# with this same version, one per backend: tap2idSdk (PROD), tap2idSdk-midqa, tap2idSdk-uat.
# The app picks the artifact from -PtargetEnvironment in app/build.gradle.kts.
tap2idSdk = "2.2.2-SNAPSHOT"

agp = "8.13.2"
# The Tap2iD SDK is built with Kotlin 2.3, so use Kotlin 2.2 or later.
kotlin = "2.3.0"
compileSdk = "36"
minSdk = "29"
targetSdk = "36"

activity = "1.10.1"
appcompat = "1.7.1"
coreKtx = "1.17.0"
coroutines = "1.10.2"
lifecycle = "2.8.7"
material = "1.13.0"
junit = "4.13.2"

[libraries]
# The PROD coordinate. Only terminal-adapter uses this alias, compile-only: the three artifacts
# share one API, and the app supplies the environment's artifact at runtime. The app does not
# use it - it derives its coordinate from the target environment.
tap2idSdk = { module = "com.credenceid:tap2idSdk", version.ref = "tap2idSdk" }

androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
